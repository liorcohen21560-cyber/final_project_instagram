<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Dark Mode Ultimate Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* General page reset */
        body, html { 
            height: 100%; margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #ffffff; overflow-x: hidden;
        }

        /* RIGHT SIDEBAR */
        .sidebar {
            width: 100px; height: 100vh; position: fixed; right: 0; top: 0;
            border-left: 1px solid #dbdbdb; display: flex; flex-direction: column;
            align-items: center; padding-top: 25px; z-index: 1000; background-color: #ffffff;
        }
        .sidebar-item { position: relative; margin-bottom: 30px; cursor: pointer; }
        .sidebar-icon-img { width: 38px; height: auto; object-fit: contain; }

        /* MAIN CONTENT AREA */
        .main-content { margin-right: 100px; margin-left: 380px; padding-top: 30px; display: flex; flex-direction: column; align-items: center; }

        /* STORIES */
        .stories-container { width: 100%; max-width: 630px; display: flex; gap: 18px; padding: 10px 0; overflow-x: auto; margin-bottom: 40px; }
        .story-item { cursor: pointer; }
        .story-ring { width: 68px; height: 68px; border-radius: 50%; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); padding: 2px; display: flex; justify-content: center; align-items: center; }
        .story-img-base { width: 62px; height: 62px; border-radius: 50%; border: 2px solid white; object-fit: cover; }
        .story-username { font-size: 11px; margin-top: 5px; }

        /* POST CARDS */
        .post-card { width: 100%; max-width: 470px; margin-bottom: 60px; }
        .post-header { display: flex; align-items: center; padding: 12px 0; }
        .post-user-avatar { width: 34px; height: 34px; border-radius: 50%; margin-left: 10px; object-fit: cover; }
        .post-main-img { width: 100%; height: auto; border: 1px solid #dbdbdb; border-radius: 4px; }
        .post-text { font-size: 14px; }
        .post-action-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 6px; }
        .post-action-icon { cursor: pointer; }
        .post-action-icon img { width: 24px; height: auto; display: block; }
        .post-action-icon-top { margin-right: auto; }
        .post-action-number { font-size: 14px; font-weight: 600; }
        
        .toggle-comments-btn { cursor: pointer; display: inline-block; font-size: 14px; }
        .comments-list { margin-top: 5px; margin-bottom: 10px; max-height: 150px; overflow-y: auto; }
        .single-comment { font-size: 14px; margin-bottom: 6px; line-height: 1.3; }
        .add-comment-section { display: flex; align-items: center; border-top: 1px solid #efefef; padding-top: 10px; margin-top: 10px; }
        .comment-input { flex-grow: 1; border: none; outline: none; font-size: 14px; background: transparent; }
        .post-comment-btn { background: transparent; border: none; color: #0095f6; font-weight: 600; font-size: 14px; cursor: pointer; padding: 0; margin-right: 10px; }
        .post-comment-btn:disabled { color: #b3dffc; cursor: default; }

        /* ALL UPDATED CHECKMARK */
        .all-updated { display: flex; flex-direction: column; align-items: center; }
        .all-updated-icon { margin-bottom: 20px; }
        .all-updated-text-header { font-weight: bold; }

        /* LEFT SIDEBAR: Suggestions */
        .suggestions-side { width: 320px; position: fixed; left: 60px; top: 40px; padding: 10px; }
        .user-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .suggestion-profile-img { width: 44px; height: 44px; border-radius: 50%; margin-left: 10px; }
        .suggested-profile-img { width: 32px; height: 32px; border-radius: 50%; margin-left: 10px; }
        .follow-link { color: #0095f6; font-weight: 600; text-decoration: none; font-size: 12px; }

        /* FOOTER */
        .footer { height: 100px; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: transparent; color: #737373; font-size: 12px; padding: 20px 0; }
        .footer-links { display: flex; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; gap: 8px; }
        .footer-links a { color: #737373; text-decoration: none; }

        /* ANIMATIONS */
        .like-btn-img { cursor: pointer; transition: transform 0.1s ease-in-out; }
        .liked-animation { animation: popLike 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
        @keyframes popLike { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        /* MODAL */
        .search-modal-overlay { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); align-items: center; justify-content: center; }
        .search-modal-content { background-color: #ffffff; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .close-search { position: absolute; top: 10px; left: 15px; font-size: 24px; font-weight: bold; cursor: pointer; color: #737373; }
        .search-input-box { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #dbdbdb; outline: none; font-size: 15px; }

        /* ==========================================
           DARK MODE STYLES (BULLETPROOF)
           ========================================== */
        body.dark-mode { background-color: #000000 !important; color: #f5f5f5 !important; }
        body.dark-mode .sidebar, body.dark-mode .search-modal-content { background-color: #000000 !important; border-color: #262626 !important; color: #f5f5f5 !important; }
        body.dark-mode .sidebar { border-left: 1px solid #262626 !important; }
        body.dark-mode .login-header, body.dark-mode .headline, body.dark-mode .text-dark, body.dark-mode .fw-bold { color: #f5f5f5 !important; }
        body.dark-mode .text-muted { color: #a8a8a8 !important; }
        body.dark-mode .custom-input, body.dark-mode .search-input-box, body.dark-mode .comment-input { background-color: #121212 !important; color: #f5f5f5 !important; border-color: #262626 !important; }
        body.dark-mode .add-comment-section { border-top-color: #262626 !important; }
        
        /* Invert regular icons to white */
        body.dark-mode .sidebar-icon-img, body.dark-mode .post-action-icon img, body.dark-mode .all-updated-icon img, body.dark-mode .close-search { filter: invert(1) !important; }
        
        /* Prevent color inversion for profile pictures, posts, and red like button */
        body.dark-mode .post-action-icon img[src*="red_like.png"], body.dark-mode .story-img-base, body.dark-mode .post-user-avatar, body.dark-mode .suggestion-profile-img, body.dark-mode .suggested-profile-img, body.dark-mode .post-main-img { filter: none !important; }
        body.dark-mode .post-main-img { border-color: #262626 !important; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-item mt-2 mb-5">
            <img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/insta.png" style="width: 40px;" alt="Logo">
        </div>
        <div class="sidebar-item"><img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/home.png" class="sidebar-icon-img" alt="Home"></div>
        <div class="sidebar-item"><img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/reels.png" class="sidebar-icon-img" alt="Reels"></div>
        <div class="sidebar-item"><img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/messages.png" class="sidebar-icon-img" alt="Messages"></div>
        <div class="sidebar-item" id="search-btn"><img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/search.png" class="sidebar-icon-img" alt="Search"></div>
        <div class="sidebar-item"><img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/explore.png" class="sidebar-icon-img" alt="Explore"></div>
        <div class="sidebar-item"><img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/like.png" class="sidebar-icon-img" alt="Activity"></div>
        <div class="sidebar-item"><img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/plus.png" class="sidebar-icon-img" alt="Create"></div>
        
        <div class="sidebar-item"><img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/profile.png" class="sidebar-icon-img" style="border-radius: 50%;" alt="Profile"></div>
        
        <div style="margin-top: auto; margin-bottom: 20px;">
            <div class="sidebar-item" id="dark-mode-toggle">
                <img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/dark_mode.png" class="sidebar-icon-img" alt="Dark Mode">
            </div>
            
            <div class="sidebar-item"><img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/tabs.png" class="sidebar-icon-img" alt="More"></div>
            <div class="sidebar-item"><img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/meta.png" style="width: 30px; opacity: 0.7;" alt="Meta"></div>
        </div>
    </div>

    <div class="main-content">
        <div class="stories-container">
            <div class="story-item text-center">
                <div class="story-ring"><img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/sport%205.png" class="story-img-base" alt="Sport 5"></div>
                <div class="story-username">sport_5</div>
            </div>
        </div>

        <div class="post-card">
            <div class="post-header">
                <img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/sport%205.png" class="post-user-avatar" alt="sport_5">
                <strong class="me-2">sport_5</strong>
                <span class="text-muted small">• 2 שע'</span>
            </div>
            <img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/deni.jpg" class="post-main-img" alt="Post Content">
            
            <div class="post-action-bar">
                <div class="d-flex align-items-center">
                    <div class="post-action-icon"><img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/like.png" class="like-btn-img" alt="Like"></div>
                    <div class="post-action-number like-count-txt" style="margin-left:12px;">186</div>
                    
                    <div class="post-action-icon"><img src="https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/comments.png" class="comment-btn-icon" alt="Comment"></div>
                    <div class="post-action-number comment-count-txt" style="margin-left:12px;">186</div>
                </div>
            </div>

            <div class="px-1">
                <p class="mb-1 post-text"><strong><span class="like-count-display">186</span> לייקים</strong></p>
                <p class="mb-1 post-text post-description"><strong>sport_5</strong> דני אבדיה בשיאו!</p>
                <p class="text-muted mb-1 post-text-link toggle-comments-btn">הצג את כל <span class="comment-count-display">186</span> התגובות</p>
                
                <div class="comments-list" style="display: none;"></div>
                <div class="add-comment-section" style="display: none;">
                    <input type="text" class="comment-input" placeholder="הוסף/י תגובה...">
                    <button class="post-comment-btn" disabled>שלח</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            
            // 1. LIKES LOGIC
            const ORIGINAL_LIKE_SRC = "https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/like.png";
            const RED_LIKE_SRC = "https://raw.githubusercontent.com/liorcohen21560-cyber/targil-1-/main/red_like.png";
            const posts = document.querySelectorAll('.post-card');

            posts.forEach(post => {
                const likeBtnImg = post.querySelector('.like-btn-img');
                const likeCountIconText = post.querySelector('.like-count-txt'); 
                const likeCountDisplayText = post.querySelector('.like-count-display'); 
                
                if (likeBtnImg && likeCountIconText) {
                    let isLiked = false;
                    const baseLikes = parseInt(likeCountIconText.textContent.replace(/,/g, ''));

                    likeBtnImg.addEventListener('click', function () {
                        likeBtnImg.classList.remove('liked-animation');
                        void likeBtnImg.offsetWidth; 
                        likeBtnImg.classList.add('liked-animation');

                        if (!isLiked) {
                            likeCountIconText.textContent = (baseLikes + 1).toLocaleString('en-US');
                            if(likeCountDisplayText) likeCountDisplayText.textContent = (baseLikes + 1).toLocaleString('en-US');
                            likeBtnImg.src = RED_LIKE_SRC;
                            isLiked = true; 
                        } else {
                            likeCountIconText.textContent = baseLikes.toLocaleString('en-US');
                            if(likeCountDisplayText) likeCountDisplayText.textContent = baseLikes.toLocaleString('en-US');
                            likeBtnImg.src = ORIGINAL_LIKE_SRC;
                            isLiked = false; 
                        }
                    });
                }

                // 2. COMMENTS LOGIC
                const commentBtnIcon = post.querySelector('.comment-btn-icon'); 
                const toggleCommentsBtn = post.querySelector('.toggle-comments-btn'); 
                const commentsList = post.querySelector('.comments-list');
                const addCommentSection = post.querySelector('.add-comment-section'); 
                const commentInput = post.querySelector('.comment-input');
                const postCommentBtn = post.querySelector('.post-comment-btn');
                const commentCountIconTxt = post.querySelector('.comment-count-txt');

                if (toggleCommentsBtn && commentsList && addCommentSection && commentInput && postCommentBtn) {
                    let currentCommentCount = parseInt(commentCountIconTxt.textContent.replace(/,/g, ''));
                    let isCommentsVisible = false;

                    function toggleCommentSection() {
                        isCommentsVisible = !isCommentsVisible;
                        commentsList.style.display = isCommentsVisible ? 'block' : 'none';
                        addCommentSection.style.display = isCommentsVisible ? 'flex' : 'none'; 
                        toggleCommentsBtn.innerHTML = isCommentsVisible ? `הסתר תגובות` : `הצג את כל <span class="comment-count-display">${currentCommentCount.toLocaleString('en-US')}</span> התגובות`;
                        if (isCommentsVisible) commentInput.focus();
                    }

                    toggleCommentsBtn.addEventListener('click', toggleCommentSection);
                    if (commentBtnIcon) commentBtnIcon.addEventListener('click', toggleCommentSection);

                    commentInput.addEventListener('input', function() {
                        if (commentInput.value.trim().length > 0) {
                            postCommentBtn.removeAttribute('disabled');
                        } else {
                            postCommentBtn.setAttribute('disabled', 'true');
                        }
                    });

                    function addComment() {
                        const commentText = commentInput.value.trim();
                        if (commentText === '') return;
                        const newComment = document.createElement('div');
                        newComment.classList.add('single-comment');
                        newComment.innerHTML = `<strong>liorcohen299</strong> ${commentText}`;
                        commentsList.appendChild(newComment);
                        currentCommentCount++;
                        commentCountIconTxt.textContent = currentCommentCount.toLocaleString('en-US');
                        commentInput.value = '';
                        postCommentBtn.setAttribute('disabled', 'true');
                        commentsList.scrollTop = commentsList.scrollHeight;
                    }

                    postCommentBtn.addEventListener('click', addComment);
                    commentInput.addEventListener('keydown', function(event) {
                        if (event.key === 'Enter') { event.preventDefault(); addComment(); }
                    });
                }
            });

            // 3. DARK MODE LOGIC
            const darkModeToggle = document.getElementById('dark-mode-toggle');
            if (darkModeToggle) {
                darkModeToggle.addEventListener('click', function() {
                    document.body.classList.toggle('dark-mode');
                });
            }
        });
    </script>
</body>
</html>
