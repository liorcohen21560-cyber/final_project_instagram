<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login - Complete with English Comments</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* General page reset and base font settings */
        body, html { 
            height: 100%; 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #ffffff;
            overflow-x: hidden;
        }

        /* Main container for the two-column split screen */
        .main-wrapper {
            display: flex;
            height: calc(100vh - 100px); /* Adjusting height to leave space for the footer */
            width: 100vw;
        }

        /* LEFT SIDE: Visual content (Headline and main image) */
        .visual-section {
            flex: 1.2; /* Takes 1.2 parts of the available width */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* RIGHT SIDE: Login form and buttons */
        .login-section {
            flex: 1; /* Takes 1 part of the available width */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end; /* Aligns the login box to the right side of the column (center of the screen) */
            padding-left: 60px; /* Space from the gray separator line */
            border-left: 1px solid #efefef; /* The vertical separator line */
        }

        /* Constraining the login form width for better readability */
        .login-content {
            width: 100%;
            max-width: 580px; 
        }

        /* Header text "Login to Instagram" */
        .login-header {
            text-align: right;
            font-weight: bold;
            font-size: 1.15rem;
            margin-bottom: 30px;
            color: #000;
        }

        /* Styling for the Username and Password input fields */
        .custom-input {
            width: 100%;
            padding: 17px 22px; 
            border-radius: 12px; /* Rounded corners for the inputs */
            border: 1px solid #dbdbdb;
            margin-bottom: 15px;
            font-size: 15px;
            outline: none; /* Removes the default focus outline */
        }

        /* Primary blue login button */
        .login-btn {
            width: 100%;
            padding: 15px;
            border-radius: 30px;
            background-color: #a2c7f5; /* Light blue color from the reference image */
            color: white;
            border: none;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 25px;
            font-size: 16px;
        }

        /* "Forgot password?" link styling */
        .forgot-pass {
            text-align: center;
            display: block;
            color: #000;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 70px;
        }

        /* Base style for the outlined buttons (Facebook and Create Account) */
        .outline-btn {
            width: 100%;
            padding: 14px;
            border-radius: 35px;
            border: 1px solid #dbdbdb;
            background: white;
            color: #000;
            font-weight: 500;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        /* Specific border color for the 'Create Account' button */
        .create-btn {
            border-color: #0095f6;
            color: #0095f6;
        }

        /* Floating Instagram icon in the top corner of the visual section */
        .insta-icon {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 55px;
        }

        /* Main large headline styling */
        .headline {
            font-size: 3.5rem;
            font-weight: bold;
            text-align: center;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        /* Gradient effect for the "Close Friends" text */
        .gradient-txt {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Styling for the main decorative image from your Desktop */
        .main-img {
            width: 100%;
            max-width: 560px;
        }

        /* Meta logo at the bottom of the login section */
        .meta-logo {
            width: 70px;
            margin-top: 30px;
        }

        /* FOOTER AREA: Styling for the gray links at the very bottom */
        .footer {
            height: 100px;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            color: #737373; /* Gray color for the footer text */
            font-size: 12px;
            padding: 20px 0;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap; /* Allows links to wrap on smaller screens */
            justify-content: center;
            margin-bottom: 10px;
            gap: 15px;
        }

        .footer-links a {
            color: #737373;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .copyright {
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    
    <div class="visual-section">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" class="insta-icon" alt="Insta">
        
        <h1 class="headline">
            לראות רגעים יומיומיים של <span class="gradient-txt">חברים קרובים.</span>
        </h1>

        <img src="C:/Users/User/Desktop/photo_first_targil.png" class="main-img" alt="Visual content">
    </div>

    <div class="login-section">
        <div class="login-content">
            <div class="login-header">התחברות לאינסטגרם</div>
            
            <form>
                <input type="text" class="custom-input" placeholder="מספר טלפון נייד, שם משתמש או דוא''ל">
                <input type="password" class="custom-input" placeholder="סיסמה">
                <button type="button" class="login-btn">התחבר/י</button>
            </form>

            <a href="#" class="forgot-pass">שכחת את הסיסמה?</a>

            <div class="w-100 text-center">
                <a href="#" class="outline-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" width="20" class="ms-2">
                    התחברות באמצעות פייסבוק
                </a>
                
                <a href="#" class="outline-btn create-btn">צרי חשבון חדש</a>

                <img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/Meta_Platforms_Inc._logo.svg" class="meta-logo" alt="Meta">
            </div>
        </div>
    </div>
</div>

<div class="footer">
    <div class="footer-links">
        <a href="#">Meta</a>
        <a href="#">אודות</a>
        <a href="#">בלוג</a>
        <a href="#">משרות</a>
        <a href="#">עזרה</a>
        <a href="#">API</a>
        <a href="#">פרטיות</a>
        <a href="#">תנאים</a>
        <a href="#">מיקומים</a>
        <a href="#">אינסטגרם Lite</a>
        <a href="#">Threads</a>
        <a href="#">Meta Verified</a>
    </div>
    <div class="copyright">
        <span>עברית ∨</span>
        <span>© 2026 Instagram from Meta</span>
    </div>
</div>

</body>
</html>
