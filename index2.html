<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Final Sports Feed</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* General page reset */
        body { 
            background-color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
        }

        /* RIGHT SIDEBAR: Uniform large icons */
        .sidebar {
            width: 100px; 
            height: 100vh; 
            position: fixed; 
            right: 0; 
            top: 0;
            border-left: 1px solid #dbdbdb; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            padding-top: 25px; 
            z-index: 1000;
        }

        .sidebar-item {
            position: relative;
            margin-bottom: 30px; 
            cursor: pointer;
        }

        .sidebar-icon-img {
            width: 38px; 
            height: auto;
            object-fit: contain;
        }

        /* MAIN CONTENT AREA */
        .main-content {
            margin-right: 100px; 
            margin-left: 380px; 
            padding-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stories-container {
            width: 100%;
            max-width: 630px;
            display: flex;
            gap: 18px;
            padding: 10px 0;
            overflow-x: auto;
            margin-bottom: 40px;
        }

        .story-ring {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            padding: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .story-img-base {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
        }

        /* POST CARD STYLING */
        .post-card {
            width: 100%;
            max-width: 470px;
            margin-bottom: 60px;
        }

        .post-header {
            display: flex;
            align-items: center;
            padding: 12px 0;
        }

        .post-user-avatar-sport5 {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            margin-left: 10px;
            object-fit: cover;
        }

        .post-main-img { 
            width: 100%; 
            height: auto; 
            border: 1px solid #dbdbdb; 
            border-radius: 4px; 
        }

        /* POST ACTION BAR: Liked/Comment/Repost/Send */
        .post-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 6px;
        }

        .post-action-icon {
            cursor: pointer;
            margin-left: 14px;
        }

        .post-action-icon img {
            width: 24px;
            height: auto;
            display: block;
        }

        /* LEFT SIDEBAR: Suggestions */
        .suggestions-side {
            width: 320px;
            position: fixed;
            left: 60px;
            top: 40px;
            padding: 10px;
        }

        .user-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .follow-link {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-item mt-2 mb-5">
            <img src="insta.png" style="width: 40px;" alt="Logo">
        </div>
        <div class="sidebar-item"><img src="home.png" class="sidebar-icon-img" alt="Home"></div>
        <div class="sidebar-item"><img src="reels.png" class="sidebar-icon-img" alt="Reels"></div>
        <div class="sidebar-item"><img src="messages.png" class="sidebar-icon-img" alt="Messages"></div>
        <div class="sidebar-item"><img src="search.png" class="sidebar-icon-img" alt="Search"></div>
        <div class="sidebar-item"><img src="explore.png" class="sidebar-icon-img" alt="Explore"></div>
        <div class="sidebar-item"><img src="like.png" class="sidebar-icon-img" alt="Activity"></div>
        <div class="sidebar-item"><img src="plus.png" class="sidebar-icon-img" alt="Create"></div>
        <div class="sidebar-item"><img src="profile.png" class="sidebar-icon-img" style="border-radius: 50%;" alt="Profile"></div>
        
        <div style="margin-top: auto; margin-bottom: 20px;">
            <div class="sidebar-item"><img src="tabs.png" class="sidebar-icon-img" alt="More"></div>
            <div class="sidebar-item"><img src="meta.png" style="width: 30px; opacity: 0.7;" alt="Meta"></div>
        </div>
    </div>

    <div class="main-content">
        
        <div class="stories-container">
            <div class="story-item text-center">
                <div class="story-ring"><img src="sport 5.png" class="story-img-base" alt="Sport 5"></div>
                <div style="font-size: 11px; margin-top: 5px;">sport_5</div>
            </div>
            <div class="story-item text-center">
                <div class="story-ring"><img src="eran.jpg" class="story-img-base" alt="Eran Zahavi"></div>
                <div style="font-size: 11px; margin-top: 5px;">eran_zahavi</div>
            </div>
        </div>

        <div class="post-card">
            <div class="post-header">
                <img src="sport 5.png" class="post-user-avatar-sport5" alt="sport_5">
                <strong class="me-2">sport_5</strong>
                <span class="text-muted small">• 2 שע'</span>
            </div>
            
            <img src="deni.jpg" class="post-main-img" alt="Post Content">
            
            <div class="post-action-bar">
                <div class="d-flex align-items-center">
                    <div class="post-action-icon"><img src="like.png" alt="Like"></div>
                    <div class="post-action-icon"><img src="comments.png" alt="Comment"></div>
                    <div class="post-action-icon"><img src="repost.png" alt="Repost"></div>
                </div>
                <div class="post-action-icon me-0"><img src="send.png" alt="Send"></div>
            </div>

            <div class="px-1">
                <p class="mb-1" style="font-size: 14px;"><strong>186 לייקים</strong></p>
                <p class="mb-1" style="font-size: 14px;"><strong>sport_5</strong> דני אבדיה בשיאו! עוד שישי של חגיגה לאומית 😍</p>
                <p class="text-muted mb-0" style="font-size: 14px; cursor: pointer;">צפה בכל 186 התגובות</p>
            </div>
        </div>

        <div class="post-card">
            <div class="post-header">
                <img src="sport 5.png" class="post-user-avatar-sport5" alt="sport_5">
                <strong class="me-2">sport_5</strong>
                <span class="text-muted small">• 5 שע'</span>
            </div>
            <img src="eran.jpg" class="post-main-img" alt="Eran Zahavi">
            <div class="post-action-bar">
                <div class="d-flex align-items-center">
                    <div class="post-action-icon"><img src="like.png" alt="Like"></div>
                    <div class="post-action-icon"><img src="comments.png" alt="Comment"></div>
                    <div class="post-action-icon"><img src="repost.png" alt="Repost"></div>
                </div>
                <div class="post-action-icon me-0"><img src="send.png" alt="Send"></div>
            </div>
            <div class="px-1">
                <p class="mb-1" style="font-size: 14px;"><strong>1,240 לייקים</strong></p>
                <p class="mb-1" style="font-size: 14px;"><strong>sport_5</strong> ערן זהבי לא עוצר! ⚽️🔥</p>
            </div>
        </div>

    </div>

    <div class="suggestions-side">
        <div class="user-row">
            <div class="d-flex align-items-center">
                <img src="profile.png" style="width: 44px; height: 44px; border-radius: 50%; margin-left: 10px;" alt="User">
                <div>
                    <div class="fw-bold small">liorcohen299</div>
                    <div class="text-muted small">Lior Cohen</div>
                </div>
            </div>
            <a href="#" class="follow-link">החלפה</a>
        </div>
        <div class="d-flex justify-content-between mt-4 mb-3">
            <span class="text-muted fw-bold small">הצעות בשבילך</span>
            <a href="#" class="text-dark text-decoration-none fw-bold small" style="font-size: 12px;">הצג הכל</a>
        </div>
        <div class="user-row">
            <div class="d-flex align-items-center">
                <img src="sport 5.png" style="width: 32px; height: 32px; border-radius: 50%; margin-left: 10px;" alt="Sport 5">
                <div>
                    <div class="fw-bold small">sport_5</div>
                    <div class="text-muted" style="font-size: 11px;">מומלץ עבורך</div>
                </div>
            </div>
            <a href="#" class="follow-link">מעקב</a>
        </div>
    </div>

</body>
</html>
